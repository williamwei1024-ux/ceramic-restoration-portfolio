<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIYUAN WEI | Restoration</title>
<meta name="description" content="陶瓷修复作品集——修复前与修复后的对比，见证破损文物的重生。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,100;0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Space+Mono&family=Inter:wght@100;300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ════════════ 顶部工具栏 ════════════ -->
<header class="toolbar">
  <div class="toolbar-inner">
    <button class="tool-btn" id="tocToggle" type="button">目录 <em>Contents</em></button>
    <h1 class="toolbar-title">陶瓷修复作品集 <span class="toolbar-sub">Ceramic Restoration · Portfolio</span></h1>
    <div class="toolbar-right">
      <button class="tool-btn" id="otherBtn" type="button">另一个我 <em>Another Me</em></button>
    </div>
  </div>
</header>

<!-- ════════════ 书本舞台 ════════════ -->
<main class="desk">
  <!-- 翻书容器（StPageFlip） -->
  <div id="pageflip" class="book-skin"></div>

  <!-- 翻页按钮 -->
  <div class="nav-btns">
    <button class="nav-btn" id="btnPrev" type="button" aria-label="上一页">← <span>Prev</span></button>
    <span class="page-num mono" id="pageNum">—</span>
    <button class="nav-btn" id="btnNext" type="button" aria-label="下一页"><span>Next</span> →</button>
    <button class="nav-btn nav-small" id="endBtn" type="button" aria-label="跳到封面或封底">首尾 <em>Cover/Back</em></button>
  </div>
  <p class="hint mono">拖动页面翻书 · 点击页面放大 · 键盘 ← / → 翻页</p>
</main>

<!-- ════════════ 目录侧栏 ════════════ -->
<aside class="toc" id="toc">
  <div class="toc-head">
    <span class="toc-title">目录 <em>Contents</em></span>
    <button class="toc-close" id="tocClose" type="button" aria-label="关闭目录">×</button>
  </div>
  <nav class="toc-list" id="tocList" aria-label="作品目录"></nav>
  <div class="toc-foot"><span>共 24 页</span><span class="toc-foot-en mono">24 Pages</span></div>
</aside>

<!-- ════════════ Lightbox ════════════ -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="查看大图">
  <button class="lightbox-close" id="lbClose" type="button" aria-label="关闭">×</button>
  <div class="lightbox-body">
    <img id="lbImg" src="" alt="">
  </div>
</div>

<script src="js/vendor/page-flip.browser.js"></script>
<script src="js/main.js"></script>
</body>
</html>
